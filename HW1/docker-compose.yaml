services:
  app:
    build: .
    container_name: app-container
    depends_on:
      - db
    environment:
      - DB_NAME=${PG_DB}
      - DB_USER=${PG_USER}
      - DB_PASSWORD=${PG_PASSWORD}
    ports:
      - "8080:8080"

  db:
    image: postgres
    container_name: db-container
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    ports:
      - "5432:5432"