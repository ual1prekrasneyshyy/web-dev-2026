spring:
  application:
    name: SpaceBountyHunters

  datasource:
    url: jdbc:mysql://db:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: ${APP_PORT}
