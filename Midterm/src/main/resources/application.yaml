spring:
  application:
    name: Midterm

  datasource:
    url: jdbc:mysql://db:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true

  liquibase:
    change-log: changelog/changelog-master.xml

server:
  port: ${APP_PORT}
